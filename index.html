function removerAcentos(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"")} function tlv(i,v){return i+v.length.toString().padStart(2,"0")+v} function crc16(p){let c=0xFFFF;for(let i=0;i<p.length;i++){c^=p.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1),c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,"0")} function gerarPix(a){let pay="";pay+=tlv("00","01");const mi=tlv("00","br.gov.bcb.pix")+tlv("01",a.pixKey);pay+=tlv("26",mi);pay+=tlv("52","0000");pay+=tlv("53","986");pay+=tlv("54",a.amount.toFixed(2));pay+=tlv("58","BR");pay+=tlv("59",removerAcentos(a.merchantName).toUpperCase().slice(0,25));pay+=tlv("60",removerAcentos(a.merchantCity).toUpperCase().slice(0,15));pay+=tlv("62",tlv("05",(a.txid||"***").slice(0,25)));pay+="6304";pay+=crc16(pay);return pay}
