<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Paulista RP - Loja</title>
<style>
body{font-family:Arial;background:#0f0f0f;color:#fff;margin:0;padding:20px}
.card{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:20px;margin:15px;max-width:350px;display:inline-block;vertical-align:top}
button{background:#00ff88;color:#000;border:0;padding:12px 20px;border-radius:8px;font-weight:bold;cursor:pointer;width:100%}
#pixModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);justify-content:center;align-items:center;flex-direction:column;z-index:9999}
#pixBox{background:#fff;color:#000;padding:25px;border-radius:12px;max-width:400px;text-align:center}
#qrcode img{width:250px;height:250px}
</style>
</head>
<body>
<h1>🛒 Nova Paulista RP - Loja VIP</h1>

<div class="card">
<h3>VIP Bronze - R$15,00</h3>
<p>Benefícios básicos</p>
<button onclick="comprar('VIP Bronze', 15)">Comprar</button>
</div>

<div class="card">
<h3>VIP Prata - R$25,00</h3>
<p>Benefícios intermediários</p>
<button onclick="comprar('VIP Prata', 25)">Comprar</button>
</div>

<div class="card">
<h3>VIP Ouro - R$45,00</h3>
<p>Benefícios completos</p>
<button onclick="comprar('VIP Ouro', 45)">Comprar</button>
</div>

<div id="pixModal">
<div id="pixBox">
<h2>Pague com PIX</h2>
<div id="qrcode"></div>
<p id="pixValor"></p>
<textarea id="pixCopiaCola" style="width:100%;height:80px;margin:10px 0"></textarea>
<button onclick="copiar()">Copiar Código</button>
<p style="font-size:12px;margin-top:10px">Após pagar, a liberação é automática no Discord!</p>
<button onclick="fechar()" style="background:#ff4444;color:#fff;margin-top:15px">Fechar</button>
</div>
</div>

<script>
async function comprar(produto, valor){
  const discord = prompt("Qual seu ID do Discord? (ex: 123456789)");
  if(!discord) return;
  document.getElementById('pixModal').style.display='flex';
  document.getElementById('qrcode').innerHTML='Gerando PIX...';
  
  try{
    const res = await fetch('/api/create-pix', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ produto, valor, discordId: discord })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    
    document.getElementById('qrcode').innerHTML = `<img src="${data.qrcodeImagem}">`;
    document.getElementById('pixCopiaCola').value = data.pixCopiaECola;
    document.getElementById('pixValor').innerText = `${produto} - R$ ${valor},00`;
  }catch(e){
    alert('Erro ao gerar PIX: ' + e.message);
    fechar();
  }
}
function copiar(){
  const el = document.getElementById('pixCopiaCola');
  el.select();
  document.execCommand('copy');
  alert('PIX copiado!');
}
function fechar(){
  document.getElementById('pixModal').style.display='none';
}
</script>
</body>
</html>
